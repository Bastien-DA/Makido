services:
  ms-command:
    build:
      context: ../..
      dockerfile: apps/command/Dockerfile
    container_name: ms-command
    ports:
      - '50051:50051'
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=command_db
      - DB_USER=command_user
      - DB_PASSWORD=${DB_PASSWORD:-local_dev_password}
      - GRPC_URL=0.0.0.0:50051
      - PAYMENT_GRPC_URL=${PAYMENT_GRPC_URL:-payment:50051}
      - TICKET_GRPC_URL=${TICKET_GRPC_URL:-ticket:50051}
      - GRPC_CERT_PATH=/run/secrets/grpc/command.crt
      - GRPC_PRIVATE_KEY_PATH=/run/secrets/grpc/command.key
      - GRPC_CLIENT_CA_PATH=/run/secrets/grpc/client-ca.crt
      - PAYMENT_CLIENT_CA_PATH=/run/secrets/grpc/payment-ca.crt
      - GRPC_SERVER_CA_PATH=/run/secrets/grpc/server-ca.crt
    volumes:
      - ${GRPC_CERT_DIR:-./certs}:/run/secrets/grpc:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ms-command-net
    restart: unless-stopped

  postgres:
    image: postgres:19
    container_name: ms-command-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=command_db
      - POSTGRES_USER=command_user
      - POSTGRES_PASSWORD=${DB_PASSWORD:-local_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U command_user -d command_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ms-command-net
    restart: unless-stopped

networks:
  ms-command-net:
    driver: bridge

volumes:
  pgdata:
