syntax = "proto3";

package command;

enum ArticleCategory {
  BURGER = 0;
  MENU = 1;
  SIDE = 2;
  DRINK = 3;
  DESSERT = 4;
  SAUCE = 5;
}

service CommandService {
  rpc CreateArticle (CreateArticleRequest) returns (ArticleResponse);
  rpc FindArticleById (FindArticleByIdRequest) returns (ArticleResponse);
  rpc GetArticles (GetArticlesRequest) returns (ArticleListResponse);
  rpc UpdateArticleAvailability (UpdateArticleAvailabilityRequest) returns (ArticleResponse);
  rpc RemoveArticle (RemoveArticleRequest) returns (RemoveArticleResponse);
  rpc FinalizeCommand (FinalizeCommandRequest) returns (FinalizeCommandResponse);
  rpc PaymentConfirmed (PaymentConfirmedRequest) returns (PaymentConfirmedResponse);
}

message CustomizationSelection {
  string groupId = 1;
  string optionId = 2;
  uint32 quantity = 3;
  uint32 includedQuantity = 4;
}

message CommandLine {
  string articleId = 1;
  uint32 quantity = 2;
  repeated CustomizationSelection customizations = 3;
}

message FinalizeCommandRequest {
  string idempotencyKey = 1;
  repeated CommandLine items = 2;
  uint64 totalCents = 3;
}

message FinalizeCommandResponse {
  string shortReference = 1;
}

message PaymentConfirmedRequest {
  string reference = 1;
  string createdAtUtc = 2;
}

message PaymentConfirmedResponse {}

message CreateArticleRequest {
  string name = 1;
  double price = 2;
  optional ArticleCategory category = 3;
  optional string description = 4;
  optional string imageUrl = 5;
  optional bool isAvailable = 6;
  repeated string allergens = 7;
  repeated CustomizationGroup customizations = 8;
  repeated string ingredients = 9;
}

message FindArticleByIdRequest {
  string id = 1;
}

message GetArticlesRequest {
  optional bool onlyAvailable = 1;
  optional ArticleCategory category = 2;
}

message UpdateArticleAvailabilityRequest {
  string id = 1;
  bool isAvailable = 2;
}

message RemoveArticleRequest {
  string id = 1;
}

message ArticleResponse {
  string id = 1;
  string name = 2;
  optional string description = 3;
  ArticleCategory category = 4;
  double price = 5;
  optional string imageUrl = 6;
  bool isAvailable = 7;
  repeated string allergens = 8;
  string createdAt = 9;
  string updatedAt = 10;
  repeated CustomizationGroup customizations = 11;
  repeated string ingredients = 12;
}

message CustomizationGroup {
  string id = 1;
  string name = 2;
  uint32 minSelections = 3;
  uint32 maxSelections = 4;
  uint32 includedSelections = 5;
  repeated CustomizationOption options = 6;
}

message CustomizationOption {
  string id = 1;
  string name = 2;
  double additionalPrice = 3;
  repeated CustomizationOptionReference incompatibleWith = 4;
}

message CustomizationOptionReference {
  string groupId = 1;
  string optionId = 2;
}

message ArticleListResponse {
  repeated ArticleResponse articles = 1;
}

message RemoveArticleResponse {
  bool deleted = 1;
}